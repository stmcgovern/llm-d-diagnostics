---
# Direct access to decode-1 vLLM (bypass sidecar).
# Used by exp1b path B to measure raw decode latency.
apiVersion: v1
kind: Service
metadata:
  name: vllm-decode-direct-svc
  labels:
    app: vllm-decode
    app.kubernetes.io/part-of: vllm-disagg-sim
spec:
  clusterIP: None
  selector:
    app: vllm-decode
  ports:
  - name: vllm
    port: 8001
    targetPort: 8001
    protocol: TCP
