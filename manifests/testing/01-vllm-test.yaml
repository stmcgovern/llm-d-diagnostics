apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-test
  labels:
    app: vllm-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vllm-test
  template:
    metadata:
      labels:
        app: vllm-test
    spec:
      containers:
      - name: vllm
        image: vllm/vllm-openai:v0.18.1
        command:
        - python3
        - -m
        - vllm.entrypoints.openai.api_server
        args:
        - --model
        - TinyLlama/TinyLlama-1.1B-Chat-v1.0
        - --host
        - "0.0.0.0"
        - --port
        - "8000"
        - --dtype
        - float16
        - --gpu-memory-utilization
        - "0.8"
        - --max-model-len
        - "2048"
        - --trust-remote-code
        env:
        - name: HF_HOME
          value: /model-cache/hf-cache
        ports:
        - containerPort: 8000
          name: http
          protocol: TCP
        resources:
          requests:
            cpu: "4"
            memory: 16Gi
            nvidia.com/gpu: "1"
          limits:
            cpu: "4"
            memory: 16Gi
            nvidia.com/gpu: "1"
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 120
          periodSeconds: 30
          timeoutSeconds: 5
        volumeMounts:
        - name: model-cache
          mountPath: /model-cache
        - name: dshm
          mountPath: /dev/shm
      volumes:
      - name: model-cache
        persistentVolumeClaim:
          claimName: model-cache
      - name: dshm
        emptyDir:
          medium: Memory
      terminationGracePeriodSeconds: 30
