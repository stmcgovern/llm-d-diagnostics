[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "F",     # pyflakes
    "W",     # pycodestyle warnings
    "I",     # isort
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "RUF",   # ruff-specific rules
]
ignore = [
    "E501",   # line too long (handled by formatter, not linter)
    "E741",   # ambiguous variable name (we use l, O in stats code)
    "RUF001", # ambiguous unicode in string — intentional math notation (×, ≈, ≥)
    "RUF002", # ambiguous unicode in docstring — same
    "RUF003", # ambiguous unicode in comment — same
    "RUF012", # mutable class attrs in test classes — fine for unittest
    "UP042",  # str(Enum) → StrEnum migration deferred (behavior change)
    "B905",   # zip(strict=) not needed for same-length math pairs
]

[tool.ruff.lint.isort]
known-first-party = ["client", "schemas", "_cluster", "pricing", "probe", "plan"]

[tool.mypy]
python_version = "3.10"
warn_return_any = false
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["toolkit/tests", "advisor/tests"]
